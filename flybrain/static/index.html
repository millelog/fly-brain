<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fly-brain arena</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #05060a; color: #cfd3dc; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
  #app { display: flex; height: 100%; }
  #left { width: 42%; min-width: 280px; position: relative; display: flex; flex-direction: column; }
  #divider { width: 6px; cursor: col-resize; background: #161a26; }
  #divider:hover { background: #2a3145; }
  #right { flex: 1; position: relative; min-width: 0; }
  #arena { flex: 1; min-height: 0; display: block; width: 100%; cursor: crosshair; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; }
  .panel { background: rgba(10,12,20,.88); border: 1px solid #222838; border-radius: 8px; padding: 10px; backdrop-filter: blur(6px); }
  #controls { margin: 8px; max-height: 38%; overflow-y: auto; }
  #hud { position: absolute; top: 10px; left: 10px; pointer-events: none; white-space: pre-line; font-variant-numeric: tabular-nums; }
  #bpanel { position: absolute; top: 10px; right: 10px; width: 250px; max-height: calc(100% - 20px); overflow-y: auto; }
  #inspector { position: absolute; bottom: 10px; left: 10px; width: 300px; display: none; }
  #inspector.on { display: block; }
  h1 { font-size: 14px; margin: 0 0 6px; color: #fff; }
  h2 { font-size: 11px; margin: 10px 0 4px; color: #8b93a7; text-transform: uppercase; letter-spacing: .05em; }
  label { display: block; margin: 4px 0 1px; color: #8b93a7; font-size: 11px; }
  select, input[type=number], input[type=text] { width: 100%; box-sizing: border-box; background: #10131c; color: #e6e9f0; border: 1px solid #2a3145; border-radius: 4px; padding: 4px; }
  input[type=range] { width: 100%; margin: 0; }
  .row { display: flex; gap: 6px; align-items: center; } .row > * { flex: 1; }
  .g { display: grid; grid-template-columns: 70px 1fr 44px; gap: 2px 6px; align-items: center; }
  .g span:last-child { text-align: right; color: #7dd3fc; font-variant-numeric: tabular-nums; }
  button { padding: 5px 8px; border: 0; border-radius: 4px; background: #3b82f6; color: #fff; font-weight: 600; cursor: pointer; }
  button.alt { background: #334155; } button.red { background: #ef4444; }
  #readouts { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; font-variant-numeric: tabular-nums; }
  #readouts span:nth-child(3n) { text-align: right; color: #7dd3fc; }
  .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  #stats { margin-top: 8px; color: #8b93a7; font-size: 11px; white-space: pre-line; }
  #trace { width: 100%; height: 90px; display: block; background: #0a0c14; border-radius: 4px; margin-top: 6px; }
  .hint { color: #5b6378; font-size: 11px; margin-top: 4px; }
  #scrub { display: none; margin: 0 8px 8px; } #scrub.on { display: block; }
  kbd { background: #1c2130; border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <canvas id="arena"></canvas>
    <div id="hud"></div>
    <div id="scrub" class="row"><input id="seek" type="range" min="0" max="0" value="0"><span id="seekv" style="flex:0 0 90px">frame 0</span></div>
    <div id="controls" class="panel">
      <div class="row">
        <button id="pause" class="alt">Pause</button><button id="reset" class="alt">Reset</button>
        <button id="rec" class="alt">Record</button><button id="save" class="alt">Save</button>
      </div>
      <div class="hint">click to place · drag to move · right-drag fly: heading · <kbd>Del</kbd>: remove selected</div>
      <div class="row" style="margin-top:6px"><div><label>Click places</label><select id="place"><option value="source">odor source</option><option value="patch">sugar patch (or shift-click)</option></select></div>
        <div><label>Wind (deg, blank = none)</label><input id="wind" type="text" placeholder="none"></div>
        <div><label>dt (ms, restarts)</label><input id="dt" type="number" value="0.1" step="0.1" min="0.1"></div></div>
      <h2>Motor map &amp; sense</h2>
      <div id="gains" class="g"></div>
    </div>
  </div>
  <div id="divider"></div>
  <div id="right">
    <canvas id="c"></canvas>
    <div id="bpanel" class="panel">
      <h1>fly-brain <span style="color:#8b93a7;font-weight:400">FlyWire v783</span></h1>
      <div id="stats">loading…</div>
      <h2>Readouts</h2><select id="ro" multiple size="4"></select><div id="readouts" style="margin-top:6px"></div>
      <h2>Poke</h2>
      <div class="row"><select id="pokepop"></select><input id="pokerate" type="number" value="150" title="Hz"><input id="pokems" type="number" value="200" title="ms"><button id="poke">Poke</button></div>
      <h2>Slice</h2>
      <div class="g" id="slice"></div>
      <label><input id="camclip" type="checkbox"> view-aligned slab</label>
      <div class="g"><span>depth</span><input id="camd" type="range" min="-600" max="600" value="0"><span id="camdv">0</span>
        <span>thickness</span><input id="camw" type="range" min="5" max="1200" value="60"><span id="camwv">60</span></div>
      <h2>Opacity</h2>
      <div class="g" id="opac"></div>
      <label><input id="actonly" type="checkbox"> activity only</label>
      <label><input id="isolate" type="checkbox"> isolate selection + partners + readouts</label>
      <label><input id="rotate" type="checkbox" checked> auto-rotate</label>
      <div id="hulls"></div>
    </div>
    <div id="inspector" class="panel">
      <div class="row"><b id="ititle">neuron</b><button id="pin" class="alt" style="flex:0">Pin</button><button id="ipoke" class="alt" style="flex:0">Poke</button><button id="iclose" class="alt" style="flex:0">×</button></div>
      <div id="ibody" style="white-space:pre-line;margin-top:4px"></div>
      <canvas id="trace"></canvas>
    </div>
  </div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as arena from '/static/arena.js';
import * as brain from '/static/brain.js';

const $ = id => document.getElementById(id);
const meta = await (await fetch('/api/meta')).json();
const xyz = new Float32Array(await (await fetch('/api/positions')).arrayBuffer());
const TRAILER = 36; // <3f5fI

let ws;
function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
brain.init({ meta, xyz, send });
arena.init({ send, canvas: $('arena') });

function onFrame(buf) {
  const dv = new DataView(buf); const t = dv.getFloat32(0, true), n = dv.getUint32(4, true);
  const idx = new Uint32Array(buf.slice(8, 8 + 4 * n)), cnt = new Uint16Array(buf.slice(8 + 4 * n, 8 + 6 * n));
  brain.onFrame(t, idx, cnt);
  const o = 8 + 6 * n;
  if (buf.byteLength >= o + TRAILER) {
    const f = [], dv2 = new DataView(buf, o);
    for (let k = 0; k < 8; k++) f.push(dv2.getFloat32(4 * k, true));
    arena.onFrame(t, { x: f[0], y: f[1], th: f[2], dnp09: f[3], mdn: f[4], dna02_l: f[5], dna02_r: f[6], mn9: f[7], feeds: dv2.getUint32(32, true) });
  }
}
function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`); ws.binaryType = 'arraybuffer';
  ws.onmessage = e => e.data instanceof ArrayBuffer ? onFrame(e.data) : onState(JSON.parse(e.data));
  ws.onclose = () => setTimeout(connect, 1000);
}
connect();

// --- state → controls ---
const GAIN_HELP = { g_f: 'fwd mm/s per Hz DNp09', g_b: 'back mm/s per Hz MDN', g_t: 'rad/s per Hz DNa02 L−R', v_base: 'base speed mm/s', vmax: 'speed cap mm/s',
  noise: 'heading noise rad/s', r0: 'ORN spontaneous Hz', r_max: 'ORN max Hz', k: 'odor half-saturation', antenna: 'antenna spacing mm', mn9_thr: 'feed threshold Hz' };
const GAIN_MAX = { g_f: 1, g_b: 1, g_t: 0.5, v_base: 30, vmax: 100, noise: 5, r0: 20, r_max: 300, k: 2, antenna: 10, mn9_thr: 100 };
let built = false;
function onState(s) {
  arena.setState(s);
  if (!built && s.gains) {
    built = true;
    $('gains').innerHTML = Object.keys(s.gains).map(k => `<span title="${GAIN_HELP[k] || ''}">${k}</span><input type="range" data-k="${k}" min="0" max="${GAIN_MAX[k] || 1}" step="${(GAIN_MAX[k] || 1) / 200}" value="${s.gains[k]}"><span id="gv_${k}">${s.gains[k]}</span>`).join('');
    $('gains').oninput = e => { const k = e.target.dataset.k; $('gv_' + k).textContent = e.target.value; send({ cmd: 'gains', [k]: +e.target.value }); };
    $('wind').value = s.wind == null ? '' : (s.wind * 180 / Math.PI).toFixed(0);
    $('dt').value = s.dt;
  }
  if (s.gains && document.activeElement?.dataset?.k === undefined) for (const k in s.gains) { const el = $('gains').querySelector(`[data-k=${k}]`); if (el) { el.value = s.gains[k]; $('gv_' + k).textContent = s.gains[k]; } }
  $('pause').textContent = s.paused ? 'Resume' : 'Pause'; $('pause').dataset.on = s.paused ? 1 : 0;
  if (meta.replay) { $('scrub').classList.add('on'); $('seek').max = s.frames - 1; if (document.activeElement !== $('seek')) $('seek').value = s.frame; $('seekv').textContent = `frame ${s.frame}/${s.frames}`; }
}
$('pause').onclick = () => send({ cmd: 'pause', on: $('pause').dataset.on !== '1' });
$('reset').onclick = () => send({ cmd: 'reset' });
$('rec').onclick = () => { const on = $('rec').classList.toggle('red'); $('rec').textContent = on ? 'Recording' : 'Record'; send({ cmd: 'record', on }); };
$('save').onclick = () => { const p = prompt('save recording to (server path)', 'trial.npz'); if (p) send({ cmd: 'save', path: p }); };
$('wind').onchange = () => send({ cmd: 'wind', dir: $('wind').value === '' ? null : +$('wind').value * Math.PI / 180 });
$('dt').onchange = () => send({ cmd: 'reset', dt: +$('dt').value });
$('seek').oninput = () => send({ cmd: 'seek', frame: +$('seek').value });

// --- divider ---
const div = $('divider'), left = $('left');
div.onpointerdown = e => { div.setPointerCapture(e.pointerId); div.onpointermove = ev => { left.style.width = Math.max(200, ev.clientX) + 'px'; arena.resize(); brain.resize(); }; };
div.onpointerup = () => { div.onpointermove = null; };
</script>
</body>
</html>
